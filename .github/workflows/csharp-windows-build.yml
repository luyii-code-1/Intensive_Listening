name: C# Windows build
on:
  push:
    branches: [2.0-dev, main]
  pull_request:
    branches: [2.0-dev, main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v2.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: scripts/publish-csharp-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: IL2-win-x64
          path: |
            artifacts/build/IL2-win-x64.zip
            artifacts/build/IL2-win-x64.zip.sha256
          if-no-files-found: error
  build:
    needs: portable-build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test IL2.slnx -c Release --nologo
      - uses: actions/download-artifact@v8
        with:
          name: IL2-win-x64
          path: artifacts/build
      - name: Verify Windows runtime
        shell: pwsh
        run: |
          $expected = ((Get-Content artifacts/build/IL2-win-x64.zip.sha256 -Raw).Trim() -split ' ')[0]
          if ((Get-FileHash artifacts/build/IL2-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Runtime archive checksum mismatch.' }
          Expand-Archive artifacts/build/IL2-win-x64.zip artifacts/build/runtime
          $runtime = (Resolve-Path artifacts/build/runtime).Path
          ./scripts/validate-csharp-windows.ps1 -RuntimeDirectory $runtime -ReportDirectory artifacts/verification
          $report = (Join-Path (Resolve-Path artifacts/verification).Path 'instance.json')
          $process = Start-Process (Join-Path $runtime 'IL.App.exe') -ArgumentList @('--verify-instance', $report) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Windows single-instance verification failed.' }
          $identity = Get-Content artifacts/verification/runtime.json -Raw | ConvertFrom-Json
          $commit = (git rev-parse --short=7 HEAD).Trim()
          if ($identity.build -ne $commit -or $identity.version -ne '2.0.0') { throw 'Release build identity mismatch.' }
      - name: Package installer
        shell: pwsh
        run: |
          ./scripts/package-csharp-windows.ps1 -RuntimeDirectory (Resolve-Path artifacts/build/runtime).Path -OutputDirectory (Join-Path $PWD 'artifacts/installer') -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $installer = Get-Item artifacts/installer/*.exe
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content artifacts/installer/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: artifacts/installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-verification
          path: |
            artifacts/verification/*
            !artifacts/verification/*.exe
  macos-build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v2.'))
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Prepare FFmpeg
        run: brew install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - name: Build and verify macOS application
        run: bash scripts/publish-csharp-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: artifacts/installer/*.dmg
          if-no-files-found: error
  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v2.')
    needs: [build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts/windows
      - uses: actions/download-artifact@v8
        with:
          name: macos-installer
          path: artifacts/macos
      - name: Attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd artifacts/windows
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" ./*.exe ../macos/*.dmg --clobber

  deploy:
    if: github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v2.')
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: website-release-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: artifacts/windows
      - uses: actions/download-artifact@v8
        with:
          name: macos-installer
          path: artifacts/macos
      - name: Verify Release assets and prepare metadata
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "Release $RELEASE_TAG is not the latest stable release; skipping website deployment."
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json
          mkdir -p artifacts/deploy
          python3 .github/scripts/prepare_release_deploy.py \
            release.json artifacts/windows artifacts/macos artifacts/deploy/latest.json
          echo 'deploy=true' >> "$GITHUB_OUTPUT"
      - name: Upload and activate website installers
        if: steps.prepare.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.IL_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.IL_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.IL_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

          remote="il-deploy@$DEPLOY_HOST"
          downloads='/opt/1panel/www/sites/il.luyii.cn/index/downloads'
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          windows_name="$(jq -r .assets.windows.filename artifacts/deploy/latest.json)"
          macos_name="$(jq -r .assets.macos.filename artifacts/deploy/latest.json)"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes "artifacts/windows/$windows_name" "$remote:$downloads/.incoming-$suffix-windows.exe"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes "artifacts/macos/$macos_name" "$remote:$downloads/.incoming-$suffix-macos.dmg"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes artifacts/deploy/latest.json "$remote:$downloads/.incoming-$suffix.json"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" \
            "python3 - $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" \
            < .github/scripts/deploy_release.py
