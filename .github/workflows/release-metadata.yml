name: Publish website release metadata

# 发布构建与附件上传完成后，把 Release 元数据写进 website 分支的 downloads/latest.json，并同步
# release.js 的兜底版本号。website 分支的 EdgeOne 自动构建随即重新部署。
#
# 只管桌面版版本。Web 播放器（web-edition）是独立版本线，由该分支上的
# bump-version.yml 负责——它的改动未必伴随桌面版发版，挂在 Release 上会漏 bump。
#
# workflow_run 入口位于默认分支 main，步骤检出 website 分支以更新官网元数据。
# 官网由 EdgeOne 托管，安装包保存在 GitHub Release。
on:
  workflow_run:
    workflows: ["C# Windows build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 Release tag（如 v2.2.0）；留空则取最新稳定版
        required: false
        type: string

permissions:
  contents: write

# 与 web-edition 的 bump-version.yml 共用同一组：两者都会推 website 分支。
concurrency:
  group: website-release-metadata
  cancel-in-progress: false

jobs:
  publish:
    # 只接续本仓库成功的 Release 构建；标签还须通过最新正式版检查。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'release' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the website branch
        uses: actions/checkout@v7
        with:
          ref: website
          token: ${{ github.token }}

      - name: Resolve the Release tag
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          requested="${REQUESTED_TAG:-$EVENT_TAG}"
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [[ -z "$requested" ]]; then
            requested="$latest"
          fi
          if [[ "$latest" != "$requested" ]]; then
            # release.js 只在「最新稳定版」的语义下成立，回填旧版会误导用户。
            echo "::notice::$requested 不是当前最新稳定版（$latest），跳过网站元数据更新。"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=$requested" >> "$GITHUB_OUTPUT"
          gh api "repos/$GH_REPO/releases/tags/$requested" > release.json
          if [[ ! "$requested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! jq -e '.draft == false and .prerelease == false' release.json >/dev/null; then
            echo "::notice::Only published three-part stable Releases update website downloads."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Write latest.json and sync the fallback tag
        if: steps.resolve.outputs.changed == 'true'
        run: node scripts/publish-release.mjs release.json .

      - name: Test and build
        if: steps.resolve.outputs.changed == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          npm test
          npm run build
          grep -q "$TAG" dist/downloads/latest.json
          # __WEB_VERSION__ 由已提交的 web.json 提供，不属于本工作流，但残留即构建出错。
          for placeholder in __VERSION__ __WEB_VERSION__; do
            if grep -q "$placeholder" dist/index.html; then
              echo "::error::index.html 里仍有未替换的 $placeholder 占位符。"
              exit 1
            fi
          done

      - name: Commit and push
        if: steps.resolve.outputs.changed == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf dist release.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/latest.json release.js
          if git diff --cached --quiet; then
            echo "::notice::网站元数据已是 $TAG，无需提交。"
            exit 0
          fi
          git commit -m "site: publish release metadata for $TAG"
          git push origin HEAD:website