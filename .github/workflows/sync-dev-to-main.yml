name: Publish dev snapshot to main

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dev-to-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish dev tree
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main dev

          DEV_SHA="$(git rev-parse origin/dev)"
          MAIN_SHA="$(git rev-parse origin/main)"
          DEV_TREE="$(git rev-parse "${DEV_SHA}^{tree}")"
          MAIN_TREE="$(git rev-parse "${MAIN_SHA}^{tree}")"

          printf 'Source dev commit: %s\nPrevious main commit: %s\nDev tree: %s\nMain tree: %s\n' \
            "$DEV_SHA" "$MAIN_SHA" "$DEV_TREE" "$MAIN_TREE"
          {
            echo "dev_sha=$DEV_SHA"
            echo "main_sha=$MAIN_SHA"
            echo "dev_tree=$DEV_TREE"
          } >> "$GITHUB_OUTPUT"

          if [[ "$DEV_TREE" == "$MAIN_TREE" ]]; then
            echo 'main already matches dev; nothing to publish'
            echo "new_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"

          NEW_COMMIT="$(printf 'chore(release): sync dev snapshot to main\n\nSource dev commit: %s\n' "$DEV_SHA" | git commit-tree "$DEV_TREE" -p "$MAIN_SHA")"
          test "$(git rev-parse "${NEW_COMMIT}^1")" = "$MAIN_SHA"
          test "$(git rev-parse "${NEW_COMMIT}^{tree}")" = "$DEV_TREE"
          test "$(git show -s --format=%P "$NEW_COMMIT")" = "$MAIN_SHA"

          # The lease requires the remote main ref to still equal the captured parent.
          # This push is a fast-forward when the lease succeeds; branch protection still applies.
          git push --force-with-lease="refs/heads/main:$MAIN_SHA" origin "$NEW_COMMIT:refs/heads/main"
          echo "new_sha=$NEW_COMMIT" >> "$GITHUB_OUTPUT"
          echo 'published=true' >> "$GITHUB_OUTPUT"

      - name: Verify published tree
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main dev
          MAIN_TREE="$(git rev-parse 'origin/main^{tree}')"
          DEV_TREE="$(git rev-parse 'origin/dev^{tree}')"
          printf 'Published dev commit: %s\nPrevious main commit: %s\nNew main commit: %s\nMain tree: %s\nDev tree: %s\n' \
            '${{ steps.publish.outputs.dev_sha }}' \
            '${{ steps.publish.outputs.main_sha }}' \
            '${{ steps.publish.outputs.new_sha }}' \
            "$MAIN_TREE" "$DEV_TREE"
          echo "main_tree=$MAIN_TREE" >> "$GITHUB_OUTPUT"
          echo "dev_tree=$DEV_TREE" >> "$GITHUB_OUTPUT"
          if [[ "$MAIN_TREE" != "$DEV_TREE" ]]; then
            echo 'Publication verification failed: main and dev trees differ.' >&2
            exit 1
          fi

      - name: Write summary
        if: always()
        shell: bash
        env:
          DEV_SHA: ${{ steps.publish.outputs.dev_sha }}
          MAIN_SHA: ${{ steps.publish.outputs.main_sha }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
          MAIN_TREE: ${{ steps.verify.outputs.main_tree }}
          DEV_TREE: ${{ steps.verify.outputs.dev_tree }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
        run: |
          {
            echo '## Publish dev snapshot to main'
            echo "- Source dev SHA: \`${DEV_SHA:-unavailable}\`"
            echo "- Previous main SHA: \`${MAIN_SHA:-unavailable}\`"
            echo "- New main SHA: \`${NEW_SHA:-unavailable}\`"
            if [[ "$VERIFY_RESULT" == 'success' ]]; then
              if [[ "$PUBLISHED" == 'true' ]]; then
                echo '- Publication: successful'
              else
                echo '- Publication: already up to date'
              fi
              echo '- Main/dev trees match: yes'
            else
              if [[ "$PUBLISHED" == 'true' ]]; then
                echo '- Publication: pushed; verification failed'
              else
                echo '- Publication: failed or unverified'
              fi
              if [[ -n "$MAIN_TREE" && -n "$DEV_TREE" ]]; then
                echo '- Main/dev trees match: no'
              else
                echo '- Main/dev trees match: unverified'
              fi
            fi
            echo "- Main tree SHA: \`${MAIN_TREE:-unavailable}\`"
            echo "- Dev tree SHA: \`${DEV_TREE:-unavailable}\`"
          } >> "$GITHUB_STEP_SUMMARY"
