name: Publish 2.0-dev snapshot to main

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-2.0-dev-to-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SYNC_APP_CLIENT_ID: ${{ vars.IL_SYNC_APP_CLIENT_ID }}
    steps:
      - name: Validate sync credentials
        env:
          APP_PRIVATE_KEY: ${{ secrets.IL_SYNC_APP_PRIVATE_KEY }}
          SYNC_TOKEN: ${{ secrets.IL_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SYNC_APP_CLIENT_ID" ]]; then
            test -n "$APP_PRIVATE_KEY" || { echo '::error::Configure IL_SYNC_APP_PRIVATE_KEY.'; exit 1; }
          elif [[ -z "$SYNC_TOKEN" ]]; then
            echo '::error::Configure IL_SYNC_APP_CLIENT_ID and IL_SYNC_APP_PRIVATE_KEY, or IL_SYNC_TOKEN. See docs/CI_SYNC.md.'
            exit 1
          fi

      - name: Create repository sync token
        if: env.SYNC_APP_CLIENT_ID != ''
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.IL_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.IL_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-checks: read
          permission-statuses: read
          permission-actions: read

      - name: Validate repository access and configure Git authentication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.IL_SYNC_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/2.0-dev" --silent
          gh auth setup-git --hostname github.com

      - name: Check out repository
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.IL_SYNC_TOKEN }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.IL_SYNC_TOKEN }}

      - name: Test snapshot synchronization
        run: python3 -m unittest discover -s .github/scripts -p 'test_sync_dev_to_main.py' -v

      - name: Publish through checked pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.IL_SYNC_TOKEN }}
        run: python3 .github/scripts/sync_dev_to_main.py
