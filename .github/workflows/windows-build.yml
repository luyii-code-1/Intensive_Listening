name: Windows build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Prepare FFmpeg
        shell: pwsh
        run: .\scripts\prepare_windows_dependencies.ps1

      - name: Prepare ARMS SDK
        shell: pwsh
        run: .\scripts\prepare_windows_arms_sdk.ps1

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $pubspec = Get-Content -LiteralPath pubspec.yaml -Raw
          $version = [regex]::Match($pubspec, '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+[0-9]+)?\s*$')
          if (-not $version.Success) { throw 'Invalid application version in pubspec.yaml.' }
          "number=$($version.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Build Windows release
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.number }}
        run: flutter build windows --release "--dart-define=ILP_APP_VERSION=$env:APP_VERSION"

      - name: Package installer
        shell: pwsh
        run: |
          & .\scripts\package_windows_installer.ps1 `
            -ReleaseDirectory 'build\windows\x64\runner\Release' `
            -OutputDirectory 'dist\installer'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/installer

      - name: Attach installer to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          installers=(dist/installer/*.exe)
          if (( ${#installers[@]} != 1 )); then
            echo "Expected one installer, found ${#installers[@]}." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${installers[0]}" --clobber

  deploy:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: installer-deploy
      cancel-in-progress: false
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v7

      - name: Download installer artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: dist/installer

      - name: Verify published asset and prepare metadata
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json
          latest_tag="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "Release $RELEASE_TAG is not the latest stable release; skipping website deployment."
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          shopt -s nullglob
          installers=(dist/installer/*.exe)
          if (( ${#installers[@]} != 1 )); then
            echo "Expected one installer, found ${#installers[@]}." >&2
            exit 1
          fi
          installer="${installers[0]}"
          asset_name="$(basename "$installer")"
          asset="$(jq --arg name "$asset_name" '[.assets[] | select(.name == $name)] | if length == 1 then .[0] else error("Expected one matching Release asset") end' release.json)"
          expected_size="$(jq -r '.size' <<< "$asset")"
          expected_sha="$(jq -r '.digest | select(startswith("sha256:")) | ltrimstr("sha256:")' <<< "$asset")"
          actual_size="$(stat -c %s "$installer")"
          actual_sha="$(sha256sum "$installer" | cut -d ' ' -f 1)"
          if [[ "$actual_size" != "$expected_size" || "$actual_sha" != "$expected_sha" ]]; then
            echo 'Build artifact differs from the published Release asset.' >&2
            exit 1
          fi

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg name "$(jq -r .name release.json)" \
            --arg asset "$asset_name" \
            --arg source "$(jq -r .browser_download_url <<< "$asset")" \
            --arg sha256 "$actual_sha" \
            --argjson size "$actual_size" \
            '{tag:$tag,name:$name,asset:$asset,size:$size,sha256:$sha256,source:$source}' \
            > dist/latest.json
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Upload and activate website installer
        if: steps.prepare.outputs.deploy == 'true'
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.IL_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.IL_DEPLOY_KNOWN_HOSTS }}
          INSTALLER: ${{ steps.prepare.outputs.installer }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

          remote='il-deploy@162.211.181.148'
          downloads='/opt/1panel/www/sites/il.luyii.cn/index/downloads'
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          scp -o BatchMode=yes "$INSTALLER" "$remote:$downloads/.incoming-$suffix.exe"
          scp -o BatchMode=yes dist/latest.json "$remote:$downloads/.incoming-$suffix.json"
          ssh -o BatchMode=yes "$remote" \
            "python3 - $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" \
            < .github/scripts/deploy_installer.py
