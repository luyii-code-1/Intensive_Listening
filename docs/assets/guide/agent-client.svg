<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 352" role="img" aria-labelledby="agentClientTitle agentClientDesc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <title id="agentClientTitle">智能体对话示意</title>
  <desc id="agentClientDesc">示意图：把应用复制的提示词粘贴到智能体对话框发送，智能体回复已登记名称并申请接管。</desc>
  <style>
    .card { fill: #ffffff; stroke: #dcdad5; stroke-width: 1.2; }
    .bar { fill: #f6f5f2; }
    .line { stroke: #e6e4df; stroke-width: 1; }
    .text { fill: #1b1f24; }
    .muted { fill: #6b7280; }
    .brand { fill: #b80f28; }
    .bubble-user { fill: #f9eef1; stroke: #eed3d9; stroke-width: 1; }
    .bubble-bot { fill: #f7f6f3; stroke: #e6e4df; stroke-width: 1; }
    .field { fill: #ffffff; stroke: #e0ded9; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1b1e23; stroke: #343941; }
      .bar { fill: #22262c; }
      .line { stroke: #2f353d; }
      .text { fill: #f0eeea; }
      .muted { fill: #9aa1ab; }
      .brand { fill: #e05a6c; }
      .bubble-user { fill: #2a1e22; stroke: #4a343a; }
      .bubble-bot { fill: #1d2025; stroke: #333840; }
      .field { fill: #14171a; stroke: #343a42; }
    }
  </style>

  <rect x="8" y="8" width="604" height="336" rx="10" class="card"/>
  <path d="M8 18 a10 10 0 0 1 10 -10 h584 a10 10 0 0 1 10 10 v26 h-604 z" class="bar"/>
  <text x="24" y="31" class="muted" font-size="12">WorkBuddy · 精听课制作</text>
  <path d="M532 32 h10" stroke="#9aa1ab" stroke-width="1.3"/>
  <rect x="556" y="27" width="12" height="10" rx="2" fill="none" stroke="#9aa1ab" stroke-width="1.3"/>
  <path d="M580 27 l12 10 M592 27 l-12 10" stroke="#9aa1ab" stroke-width="1.3"/>
  <path d="M8 44 H612" class="line"/>

  <rect x="160" y="60" width="432" height="104" rx="12" class="bubble-user"/>
  <text x="176" y="84" class="text" font-size="13">请使用本机 Intensive Listening 应用制作一份精听课程。</text>
  <text x="176" y="104" class="text" font-size="13">先读取应用生成的 MCP.md，按其中的流程连接 MCP，</text>
  <text x="176" y="124" class="text" font-size="13">提交你的自报名称，并请求我批准接管。</text>
  <text x="176" y="144" class="text" font-size="13">本次输入：标题「六级听力 第一套」，音频 unit-1.mp3。</text>

  <circle cx="30" cy="206" r="11" class="brand"/>
  <text x="30" y="210" fill="#ffffff" font-size="9.5" font-weight="600" text-anchor="middle">W</text>
  <rect x="48" y="168" width="470" height="76" rx="12" class="bubble-bot"/>
  <text x="64" y="192" class="text" font-size="13">已登记名称：WorkBuddy 桌面版。</text>
  <text x="64" y="212" class="text" font-size="13">正在申请接管，请在应用弹窗中点击「批准接管」。</text>
  <text x="64" y="232" class="text" font-size="13">接管后我会按 11 个步骤制作并上报进度。</text>

  <rect x="24" y="276" width="472" height="36" rx="8" class="field"/>
  <text x="40" y="299" class="muted" font-size="12">输入消息…</text>
  <rect x="508" y="276" width="80" height="36" rx="8" class="brand"/>
  <text x="548" y="299" fill="#ffffff" font-size="12.5" text-anchor="middle">发送</text>
</svg>
