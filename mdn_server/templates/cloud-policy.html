<h2>云服务管理</h2>
<div class="option-grid">
 <label>云连接<select data-cloud-option="mode"><option value="inherit">继承</option><option value="followLocal">跟随本机</option><option value="enabled">启用并锁定</option><option value="disabled">关闭并锁定</option></select></label>
 <label>要求云登录<select data-cloud-option="requireLogin"><option value="inherit">继承</option><option value="true">开启</option><option value="false">关闭</option></select></label>
 <label>锁定当前账号<select data-cloud-option="lockAccount"><option value="inherit">继承</option><option value="true">开启</option><option value="false">关闭</option></select></label>
</div>
<p class="muted">登录由终端用户在浏览器授权，本地课程仍可播放。锁定后禁止主动退出和切换账号，管理员远程退出后可重新授权。</p>
