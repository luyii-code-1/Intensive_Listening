<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDN 管理</title>
<style>body{font:15px "Segoe UI",sans-serif;background:#f5f6f8;color:#20242b;margin:0}main{max-width:400px;margin:15vh auto;padding:32px;background:white;border:1px solid #ddd;border-radius:8px}h1{font-size:24px}input,button{box-sizing:border-box;font:inherit;padding:10px;width:100%;margin:8px 0;border:1px solid #bbb;border-radius:4px}button{background:#0067c0;color:white;border:0}</style>
<main><h1>{{ organization }} · MDN</h1><p>登录组织管理后台</p>{% if login_message %}<p role="alert">登录状态失效或凭证错误，请重新登录。</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="form_token" value="{{ csrf }}"><label>管理员密码<input type="password" name="password" required autocomplete="current-password"></label><button>登录</button></form></main></html>
